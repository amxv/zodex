[package]
name = "zodex"
version = "0.5.27"
edition = "2024"

[[bin]]
name = "zodex"
path = "src/bin/zodex.rs"

[[bin]]
name = "zodex-agent"
path = "src/bin/zodex-agent.rs"

[[bin]]
name = "git-remote-zodex"
path = "src/bin/git-remote-zodex.rs"

[[bin]]
name = "zodexd"
path = "src/bin/zodexd.rs"

[[bin]]
name = "zodex-prd"
path = "src/bin/zodex-prd.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
codex-apply-patch = { git = "https://github.com/openai/codex.git", rev = "a3d93e1e692f1144cf8685175a5d1f6bf7294f57" }
codex-exec-server = { path = "crates/codex-exec-server-shim" }
codex-utils-path-uri = { git = "https://github.com/openai/codex.git", rev = "a3d93e1e692f1144cf8685175a5d1f6bf7294f57" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
jsonwebtoken = "9.3"
fs2 = "0.4"
rand = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
rpassword = "7.5"
rmcp = { version = "3.1.2", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
similar = "2.7"
strip-ansi-escapes = "0.2.1"
sysinfo = "0.39"
tempfile = "3.14"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1.44", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
toml = "1.0"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "signal", "process", "term", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
zip = { version = "5.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
pretty_assertions = "1.4"

# Keep the upstream Codex patch parser/matcher without compiling its unrelated
# remote execution, WebSocket, sandbox server, and process infrastructure.
[patch."https://github.com/openai/codex.git"]
codex-exec-server = { path = "crates/codex-exec-server-shim" }

# Keep local edit/build/test loops fast while retaining useful file/line
# backtraces. Dependencies do not need debug info for normal development.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
