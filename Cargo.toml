[package]
name = "zodex"
version = "0.3.9"
edition = "2024"

[[bin]]
name = "zodex"
path = "src/bin/zodex.rs"

[[bin]]
name = "zodex-agent"
path = "src/bin/zodex-agent.rs"

[[bin]]
name = "git-remote-zodex"
path = "src/bin/git-remote-zodex.rs"

[[bin]]
name = "zodexd"
path = "src/bin/zodexd.rs"

[[bin]]
name = "zodex-prd"
path = "src/bin/zodex-prd.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
codex-apply-patch = { git = "https://github.com/openai/codex.git", rev = "a265d6043edc8b41e42ae508291f4cfb9ed46805" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
jsonwebtoken = "9.3"
nix = { version = "0.31", features = ["fs", "signal", "process", "term", "user"] }
rand = "0.10"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
rpassword = "7.5"
rmcp = { version = "3.1.2", features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
similar = "2.7"
strip-ansi-escapes = "0.2.1"
tempfile = "3.14"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1.44", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
toml = "1.0"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
pretty_assertions = "1.4"
