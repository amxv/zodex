name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - README.md
      - AGENTS.md
      - .agents/**
      - scripts/check.sh
      - scripts/check-product-contract.sh
      - scripts/install.sh
      - scripts/install.ps1
      - apps/liveboard/**
      - apps/menubar/**
      - services/cloudflare-proxy/**
      - docs/src/content/docs/local.md
      - docs/src/content/docs/local/setup.md
      - docs/src/content/docs/sprite.md
      - src/**
      - tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - README.md
      - AGENTS.md
      - .agents/**
      - scripts/check.sh
      - scripts/check-product-contract.sh
      - scripts/install.sh
      - scripts/install.ps1
      - apps/liveboard/**
      - apps/menubar/**
      - services/cloudflare-proxy/**
      - docs/src/content/docs/local.md
      - docs/src/content/docs/local/setup.md
      - docs/src/content/docs/sprite.md
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build Liveboard assets
        working-directory: apps/liveboard
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate product and MCP contract
        run: bash scripts/check-product-contract.sh

      - name: Smoke-test Linux Local surface
        run: |
          cargo test --locked --lib \
            local::secret::linux_tests::linux_runtime_key_store_is_user_only_and_round_trips \
            -- --exact
          cargo build --locked --bin zodex
          target/debug/zodex local --help
          target/debug/zodex local setup --help
          target/debug/zodex local start --help
          target/debug/zodex local watch --help

      - name: Run repository validation
        shell: bash
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check.sh 2>&1 | tee "$log"; then
            exit 0
          fi

          python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          tail = text[-6000:]
          escaped = (
              tail.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Repository validation failed::{escaped}")
          PY
          exit 1

  macos:
    name: macOS Apple Silicon validation
    runs-on: macos-15
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust for target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Liveboard dependencies and browsers
        working-directory: apps/liveboard
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium webkit

      - name: Validate and build Liveboard
        working-directory: apps/liveboard
        run: |
          bun run typecheck
          bun run test
          bun run test:browser
          bun run test:browser:webkit
          bun run build

      - name: Validate product and MCP contract
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: bash scripts/check-product-contract.sh

      - name: Run repository validation
        shell: bash
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check.sh 2>&1 | tee "$log"; then
            exit 0
          fi

          python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          tail = text[-6000:]
          escaped = (
              tail.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Repository validation failed::{escaped}")
          PY
          exit 1

  windows:
    name: Windows operator validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build Liveboard assets
        working-directory: apps/liveboard
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Check Windows operator and Local runtime
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: cargo check --locked --lib --bin zodex

      - name: Compile Windows test targets
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: cargo test --locked --lib --bin zodex --no-run

      - name: Run Windows-relevant unit tests
        shell: pwsh
        run: |
          cargo test --locked --lib local::liveboard::server_tests -- --nocapture
          cargo test --locked --lib local::liveboard::launch::tests::supported_platform_has_browser_and_clipboard_attempts -- --exact
          cargo test --locked --lib local::environment_handoff::tests::environment_handoff_round_trips_and_is_consumed -- --exact
          cargo test --locked --lib local::environment_handoff::tests::windows_environment_handoff_preserves_utf16_values -- --exact
          cargo test --locked --lib local::lifecycle_context::windows_tests::windows_resolves_builtin_powershell_from_captured_system_root -- --exact
          cargo test --locked --lib local::paths::tests::local_paths_separate_durable_and_runtime_state -- --exact
          cargo test --locked --lib local::private_fs::windows_tests::windows_private_file_acl_is_user_only_and_verifiable -- --exact
          cargo test --locked --lib local::private_fs::windows_tests::windows_recreated_private_file_is_resecured -- --exact
          cargo test --locked --lib local::private_fs::windows_tests::windows_recreated_private_directory_is_resecured -- --exact
          cargo test --locked --lib local::tunnel_release::tests::architecture_selectors_track_platform_asset_suffixes -- --exact
          cargo test --locked --lib session::process::tests::windows_current_process_uses_creation_time_identity -- --exact
          cargo test --locked --bin zodex operator_cli::local_cli_tests::setup_env_input_is_scriptable_without_secret_argv -- --exact
          cargo test --locked --bin zodex operator_upgrade::operator_upgrade_tests::windows_operator_target_and_binary_name_match_release_contract -- --exact
          cargo test --locked --bin zodex operator_upgrade::operator_upgrade_tests::windows_upgrade_uses_builtin_powershell -- --exact

      - name: Smoke test Windows CLI
        shell: pwsh
        run: |
          cargo build --locked --bin zodex
          .\target\debug\zodex.exe --version
          .\target\debug\zodex.exe local --help | Out-Null
          .\target\debug\zodex.exe local setup --help | Out-Null
          .\target\debug\zodex.exe local watch --help | Out-Null
          .\target\debug\zodex.exe upgrade --help | Out-Null

      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE/scripts/install.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
