name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - README.md
      - AGENTS.md
      - .agents/**
      - scripts/check.sh
      - scripts/check-product-contract.sh
      - scripts/install.sh
      - scripts/install.ps1
      - apps/liveboard/**
      - apps/menubar/**
      - apps/tray/**
      - services/cloudflare-proxy/**
      - docs/src/content/docs/local.md
      - docs/src/content/docs/local/setup.md
      - docs/src/content/docs/sprite.md
      - src/**
      - tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - README.md
      - AGENTS.md
      - .agents/**
      - scripts/check.sh
      - scripts/check-product-contract.sh
      - scripts/install.sh
      - scripts/install.ps1
      - apps/liveboard/**
      - apps/menubar/**
      - apps/tray/**
      - services/cloudflare-proxy/**
      - docs/src/content/docs/local.md
      - docs/src/content/docs/local/setup.md
      - docs/src/content/docs/sprite.md
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build Liveboard assets
        working-directory: apps/liveboard
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate product and MCP contract
        run: bash scripts/check-product-contract.sh

      - name: Smoke-test Linux Local surface
        run: |
          cargo test --locked --lib \
            local::secret::linux_tests::linux_runtime_key_store_is_user_only_and_round_trips \
            -- --exact
          cargo build --locked --bin zodex
          target/debug/zodex local --help
          target/debug/zodex local setup --help
          target/debug/zodex local start --help
          target/debug/zodex local watch --help

      - name: Validate Linux desktop tray helper
        run: |
          cargo test --locked --manifest-path apps/tray/Cargo.toml
          cargo build --locked --manifest-path apps/tray/Cargo.toml
          apps/tray/target/debug/zodex-tray --version
          apps/tray/target/debug/zodex-tray --autostart-status
          temp_config="$(mktemp -d)"
          trap 'rm -rf "$temp_config"' EXIT
          XDG_CONFIG_HOME="$temp_config" apps/tray/target/debug/zodex-tray --enable-autostart
          grep '^Exec=' "$temp_config/autostart/zodex-tray.desktop"
          test "$(XDG_CONFIG_HOME="$temp_config" apps/tray/target/debug/zodex-tray --autostart-status)" = enabled
          XDG_CONFIG_HOME="$temp_config" apps/tray/target/debug/zodex-tray --disable-autostart
          test "$(XDG_CONFIG_HOME="$temp_config" apps/tray/target/debug/zodex-tray --autostart-status)" = disabled

          # Simulate upgrading a pre-tray Local install without rerunning setup.
          # The new tray should register for the next desktop login but never
          # start Local or override a subsequent opt-out.
          mkdir -p "$temp_config/source" "$temp_config/installed" "$temp_config/home"
          cp target/debug/zodex "$temp_config/source/zodex"
          cp apps/tray/target/debug/zodex-tray "$temp_config/source/zodex-tray"
          printf 'old Zodex CLI\n' > "$temp_config/installed/zodex"
          env HOME="$temp_config/home" XDG_CONFIG_HOME="$temp_config" \
            ZODEX_INSTALL_MODE=operator ZODEX_UPGRADE_MODE=1 ZODEX_SKIP_TRAY_LAUNCH=1 \
            ZODEX_BINARY_SOURCE_DIR="$temp_config/source" ZODEX_INSTALL_DIR="$temp_config/installed" \
            bash scripts/install.sh
          test -x "$temp_config/installed/zodex-tray"
          test "$(XDG_CONFIG_HOME="$temp_config" "$temp_config/installed/zodex-tray" --autostart-status)" = enabled
          test ! -d "$temp_config/home/.local/state/zodex/local/runtime"
          XDG_CONFIG_HOME="$temp_config" "$temp_config/installed/zodex-tray" --disable-autostart
          env HOME="$temp_config/home" XDG_CONFIG_HOME="$temp_config" \
            ZODEX_INSTALL_MODE=operator ZODEX_UPGRADE_MODE=1 ZODEX_SKIP_TRAY_LAUNCH=1 \
            ZODEX_BINARY_SOURCE_DIR="$temp_config/source" ZODEX_INSTALL_DIR="$temp_config/installed" \
            bash scripts/install.sh
          test "$(XDG_CONFIG_HOME="$temp_config" "$temp_config/installed/zodex-tray" --autostart-status)" = disabled

          # CLI and tray share persisted login settings. Enabling only
          # registers the tray for future desktop logins; the tunnel remains
          # stopped now. Disabling preserves the selected start folder and the
          # independent Launch Tray at Login setting.
          login_cli=(env HOME="$temp_config/home" XDG_CONFIG_HOME="$temp_config" "$temp_config/installed/zodex")
          "${login_cli[@]}" local autostart status --json | grep '"launch_tunnel_at_login":false'
          "${login_cli[@]}" local autostart enable "$temp_config/source"
          "${login_cli[@]}" local autostart status --json | grep '"launch_tunnel_at_login":true'
          test "$(XDG_CONFIG_HOME="$temp_config" "$temp_config/installed/zodex-tray" --autostart-status)" = enabled
          test ! -e "$temp_config/home/.local/state/zodex/local/runtime/state.json"
          "${login_cli[@]}" local autostart disable
          "${login_cli[@]}" local autostart status --json | grep '"launch_tunnel_at_login":false'
          grep -F "$temp_config/source" "$temp_config/zodex/tray.json"
          test "$(XDG_CONFIG_HOME="$temp_config" "$temp_config/installed/zodex-tray" --autostart-status)" = enabled
          "${login_cli[@]}" local autostart folder "$temp_config/home"
          grep -F "$temp_config/home" "$temp_config/zodex/tray.json"

      - name: Run repository validation
        shell: bash
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
          ZODEX_SERIAL_RUST_TESTS: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check.sh 2>&1 | tee "$log"; then
            exit 0
          fi

          python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          tail = text[-6000:]
          escaped = (
              tail.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Repository validation failed::{escaped}")
          PY
          exit 1

  macos:
    name: macOS Apple Silicon validation
    runs-on: macos-15
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust for target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Liveboard dependencies and browsers
        working-directory: apps/liveboard
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium webkit

      - name: Validate and build Liveboard
        working-directory: apps/liveboard
        run: |
          bun run typecheck
          bun run test
          bun run test:browser
          bun run test:browser:webkit
          bun run build

      - name: Validate product and MCP contract
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: bash scripts/check-product-contract.sh

      - name: Run repository validation
        shell: bash
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check.sh 2>&1 | tee "$log"; then
            exit 0
          fi

          python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          tail = text[-6000:]
          escaped = (
              tail.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Repository validation failed::{escaped}")
          PY
          exit 1

  windows:
    name: Windows operator validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Build Liveboard assets
        working-directory: apps/liveboard
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Check Windows operator and Local runtime
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: cargo check --locked --lib --bin zodex

      - name: Compile Windows test targets
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: cargo test --locked --lib --bin zodex --no-run

      - name: Run Windows-relevant unit tests
        shell: pwsh
        run: |
          cargo test --locked --lib local::liveboard::server_tests -- --nocapture
          cargo test --locked --lib local::liveboard::server::port_tests -- --nocapture
          cargo test --locked --lib local::login_preferences::tests -- --nocapture
          cargo test --locked --lib local::history::query::automatic_update_tests -- --nocapture
          cargo test --locked --lib local::liveboard::launch::tests::supported_platform_has_browser_and_clipboard_attempts -- --exact
          cargo test --locked --lib local::environment_handoff::tests::environment_handoff_round_trips_and_is_consumed -- --exact
          cargo test --locked --lib local::environment_handoff::tests::windows_environment_handoff_preserves_utf16_values -- --exact
          cargo test --locked --lib local::environment_handoff::tests::windows_environment_handoff_ignores_special_equals_prefixed_entries -- --exact
          cargo test --locked --lib local::environment_handoff::tests::windows_environment_handoff_accepts_actual_process_snapshot -- --exact
          cargo test --locked --lib local::environment_handoff::tests::windows_environment_handoff_still_rejects_invalid_regular_keys -- --exact
          cargo test --locked --lib local::lifecycle_context::windows_tests::windows_resolves_builtin_powershell_from_captured_system_root -- --exact
          cargo test --locked --lib local::paths::tests::local_paths_separate_durable_and_runtime_state -- --exact
          cargo test --locked --lib local::private_fs::windows_tests::windows_private_file_acl_is_user_only_and_verifiable -- --exact
          cargo test --locked --lib local::private_fs::windows_tests::windows_recreated_private_file_is_resecured -- --exact
          cargo test --locked --lib local::private_fs::windows_tests::windows_recreated_private_directory_is_resecured -- --exact
          cargo test --locked --lib local::tunnel_release::tests::architecture_selectors_track_platform_asset_suffixes -- --exact
          cargo test --locked --lib session::process::tests::windows_current_process_uses_creation_time_identity -- --exact
          cargo test --locked --bin zodex operator_cli::local_cli_tests::setup_env_input_is_scriptable_without_secret_argv -- --exact
          cargo test --locked --bin zodex operator_cli::desktop_preferences_tests::automatic_updates_accepts_explicit_true_and_false_from_cli -- --exact
          cargo test --locked --bin zodex operator_cli::desktop_preferences_tests::automatic_update_is_an_internal_desktop_command -- --exact
          cargo test --locked --bin zodex operator_upgrade::automatic_update_safety_tests -- --nocapture
          cargo test --locked --bin zodex operator_upgrade::operator_upgrade_tests::windows_deferred_replacement_can_restore_idle_tunnel -- --exact
          cargo test --locked --bin zodex operator_cli::desktop_preferences_tests::port_and_auto_update_commands_preserve_legacy_start_folder -- --exact
          cargo test --locked --bin zodex operator_upgrade::operator_upgrade_tests::windows_operator_target_and_binary_name_match_release_contract -- --exact
          cargo test --locked --bin zodex operator_upgrade::operator_upgrade_tests::windows_upgrade_uses_builtin_powershell -- --exact

      - name: Smoke test Windows CLI
        shell: pwsh
        run: |
          cargo build --locked --bin zodex
          .\target\debug\zodex.exe --version
          .\target\debug\zodex.exe local --help | Out-Null
          .\target\debug\zodex.exe local setup --help | Out-Null
          .\target\debug\zodex.exe local watch --help | Out-Null
          .\target\debug\zodex.exe upgrade --help | Out-Null

      - name: Validate Windows tray helper
        shell: pwsh
        run: |
          cargo test --locked --manifest-path apps/tray/Cargo.toml
          cargo build --locked --manifest-path apps/tray/Cargo.toml
          $tray = (Resolve-Path '.\apps\tray\target\debug\zodex-tray.exe').Path
          $check = Start-Process -FilePath $tray -ArgumentList '--version' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Windows tray failed its version smoke test' }
          $enable = Start-Process -FilePath $tray -ArgumentList '--enable-autostart' -Wait -PassThru -WindowStyle Hidden
          if ($enable.ExitCode -ne 0) { throw 'Windows tray startup registration failed' }
          $value = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').ZodexTray
          if ($value -notlike '*zodex-tray.exe*') { throw 'Windows tray startup registration was not created' }
          $disable = Start-Process -FilePath $tray -ArgumentList '--disable-autostart' -Wait -PassThru -WindowStyle Hidden
          if ($disable.ExitCode -ne 0) { throw 'Windows tray startup deregistration failed' }

      - name: Validate Windows tunnel autostart CLI and shared preferences
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'zodex-login-ci'
          $bin = Join-Path $temp 'bin'
          $appdata = Join-Path $temp 'appdata'
          $workspace = Join-Path $temp 'workspace'
          New-Item -ItemType Directory -Force -Path $bin, $appdata, $workspace | Out-Null
          Copy-Item 'target/debug/zodex.exe' "$bin/zodex.exe"
          Copy-Item 'apps/tray/target/debug/zodex-tray.exe' "$bin/zodex-tray.exe"
          $cli = Join-Path $bin 'zodex.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $oldValue = (Get-ItemProperty -Path $runKey -Name ZodexTray -ErrorAction SilentlyContinue).ZodexTray
          $oldAppData = $env:APPDATA
          $oldXdgConfig = $env:XDG_CONFIG_HOME
          try {
            $env:APPDATA = $appdata
            Remove-Item Env:XDG_CONFIG_HOME -ErrorAction SilentlyContinue
            $status = (& $cli local autostart status --json | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $status.launch_tunnel_at_login) { throw 'Tunnel autostart must default off' }
            & $cli local autostart enable $workspace
            if ($LASTEXITCODE -ne 0) { throw 'Failed to enable tunnel autostart' }
            $status = (& $cli local autostart status --json | ConvertFrom-Json)
            if (-not $status.launch_tunnel_at_login -or $status.start_folder -notlike '*workspace*') {
              throw 'Windows terminal setting did not persist start folder and enabled flag'
            }
            $registered = (Get-ItemProperty -Path $runKey -Name ZodexTray).ZodexTray
            if ($registered -notlike '*zodex-tray.exe*') { throw 'Enabling tunnel did not enable tray login' }
            & $cli local autostart disable
            if ($LASTEXITCODE -ne 0) { throw 'Failed to disable tunnel autostart' }
            $status = (& $cli local autostart status --json | ConvertFrom-Json)
            if ($status.launch_tunnel_at_login -or $status.start_folder -notlike '*workspace*') {
              throw 'Disabling tunnel autostart lost the saved folder'
            }
            $registered = (Get-ItemProperty -Path $runKey -Name ZodexTray).ZodexTray
            if ($registered -notlike '*zodex-tray.exe*') { throw 'Disabling tunnel incorrectly disabled tray login' }
          } finally {
            $env:APPDATA = $oldAppData
            if ($null -eq $oldXdgConfig) {
              Remove-Item Env:XDG_CONFIG_HOME -ErrorAction SilentlyContinue
            } else {
              $env:XDG_CONFIG_HOME = $oldXdgConfig
            }
            if ($null -eq $oldValue) {
              Remove-ItemProperty -Path $runKey -Name ZodexTray -ErrorAction SilentlyContinue
            } else {
              Set-ItemProperty -Path $runKey -Name ZodexTray -Value $oldValue
            }
          }

      - name: Exercise pre-tray Windows upgrade migration
        shell: pwsh
        run: |
          $temp = Join-Path $env:RUNNER_TEMP 'zodex-tray-ci-package'
          $archiveName = 'zodex-x86_64-pc-windows-msvc'
          $packageDir = Join-Path $temp $archiveName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item 'target/debug/zodex.exe' "$packageDir/zodex.exe"
          Copy-Item 'apps/tray/target/debug/zodex-tray.exe' "$packageDir/zodex-tray.exe"
          tar -C $temp -czf "$temp/$archiveName.tar.gz" $archiveName
          if ($LASTEXITCODE -ne 0) { throw 'Could not create Windows migration fixture archive' }
          & "$env:GITHUB_WORKSPACE/tests/windows_tray_migration.ps1" -ReleaseArchive "$temp/$archiveName.tar.gz"

      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install.ps1', 'scripts/finish-windows-upgrade.ps1', 'tests/windows_tray_migration.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              "$env:GITHUB_WORKSPACE/$file",
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
