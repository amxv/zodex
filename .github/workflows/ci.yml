name: CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - README.md
      - AGENTS.md
      - .agents/**
      - scripts/check.sh
      - scripts/check-product-contract.sh
      - scripts/install.sh
      - apps/liveboard/**
      - apps/menubar/**
      - services/cloudflare-proxy/**
      - docs/src/content/docs/local.md
      - docs/src/content/docs/local/setup.md
      - docs/src/content/docs/sprite.md
      - src/**
      - tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - README.md
      - AGENTS.md
      - .agents/**
      - scripts/check.sh
      - scripts/check-product-contract.sh
      - scripts/install.sh
      - apps/liveboard/**
      - apps/menubar/**
      - services/cloudflare-proxy/**
      - docs/src/content/docs/local.md
      - docs/src/content/docs/local/setup.md
      - docs/src/content/docs/sprite.md
      - src/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate product and MCP contract
        run: bash scripts/check-product-contract.sh

      - name: Run repository validation
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check.sh 2>&1 | tee "$log"; then
            exit 0
          fi

          python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          tail = text[-6000:]
          escaped = (
              tail.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Repository validation failed::{escaped}")
          PY
          exit 1

  macos:
    name: macOS Apple Silicon validation
    runs-on: macos-15
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust for target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Bun for Liveboard
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Liveboard dependencies and browsers
        working-directory: apps/liveboard
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium webkit

      - name: Validate and build Liveboard
        working-directory: apps/liveboard
        run: |
          bun run typecheck
          bun run test
          bun run test:browser
          bun run test:browser:webkit
          bun run build

      - name: Validate product and MCP contract
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: bash scripts/check-product-contract.sh

      - name: Run repository validation
        shell: bash
        env:
          ZODEX_LIVEBOARD_EMBED_REQUIRED: "1"
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if bash scripts/check.sh 2>&1 | tee "$log"; then
            exit 0
          fi

          python3 - "$log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          tail = text[-6000:]
          escaped = (
              tail.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Repository validation failed::{escaped}")
          PY
          exit 1
