name: Cloudflare Proxy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-proxy.yml
      - services/cloudflare-proxy/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-proxy.yml
      - services/cloudflare-proxy/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Test Worker
        working-directory: services/cloudflare-proxy
        run: bun test
